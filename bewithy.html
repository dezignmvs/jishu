<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Discover your speaking, communication, and confidence level with the BtheU Speaking Potential Snapshot.">
  <title>Speaking Potential Snapshot | BtheU</title>
  <link rel="icon" href="faviocn.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
  <link href="https://api.fontshare.com/v2/css?f[]=clash-grotesk@200,300,400,500,600,700&display=swap" rel="stylesheet">
  <style>
    :root {
      --accent: #e69100;
      --ink: #16171f;
      --muted: #70798c;
      --cream: #fff6dc;
    }

    * { box-sizing: border-box; }

    html, body { margin: 0; min-height: 100%; }

    body {
      min-height: 100vh;
      color: var(--ink);
      background:
        radial-gradient(circle at 2% 59%, rgba(255, 237, 187, .65), transparent 25%),
        radial-gradient(circle at 99% 3%, rgba(255, 246, 220, .9), transparent 22%),
        #fff;
      font-family: "Clash Grotesk", "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .hero {
      width: min(1126px, calc(100% - 48px));
      min-height: 100vh;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1.15fr .85fr;
      align-items: center;
      gap: 74px;
      padding: 39px 0;
    }

    .copy { padding-bottom: 4px; }

    .brand-pill {
      width: fit-content;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 27px;
      padding: 7px 16px;
      border: 1px solid #dfe3e6;
      border-radius: 999px;
      background: rgba(255, 255, 255, .86);
      color: var(--accent);
      box-shadow: 0 4px 14px rgba(31, 50, 74, .04);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .12em;
    }

    .brand-mark { width: 14px; height: 14px; }

    h1 {
      max-width: 545px;
      margin: 0;
      font-family: "Clash Grotesk", "Inter", sans-serif;
      font-weight: 700;
      font-size: clamp(45px, 4.15vw, 60px);
      line-height: 1.04;
      letter-spacing: -.035em;
      text-transform: uppercase;
    }

    .lede {
      max-width: 555px;
      margin: 20px 0 34px;
      color: var(--muted);
      font-size: 17px;
      line-height: 1.76;
    }

    .button-shell {
      display: inline-flex;
      padding: 11px;
      border-radius: 999px;
      background: rgba(239, 244, 255, .8);
    }

    .cta {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      min-width: 275px;
      padding: 18px 26px;
      border-radius: 999px;
      background: var(--accent);
      color: #fff;
      text-decoration: none;
      font-size: 14px;
      font-weight: 800;
      transition: transform .2s ease, background .2s ease, box-shadow .2s ease;
    }

    .cta:hover {
      transform: translateY(-2px);
      background: #16171f;
      box-shadow: 0 10px 24px rgba(230, 145, 0, .2);
    }

    .cta svg { width: 18px; height: 18px; transition: transform .2s ease; }
    .cta:hover svg { transform: translateX(3px); }

    .portrait-card {
      width: 416px;
      max-width: 100%;
      justify-self: end;
      padding: 16px;
      border-radius: 32px;
      background: var(--cream);
      border: 1px solid rgba(230, 145, 0, .18);
    }

    .portrait-card img {
      display: block;
      width: 100%;
      height: 480px;
      object-fit: cover;
      object-position: center 25%;
      border-radius: 25px;
    }

    .caption {
      margin: 18px 0 1px;
      font-family: "Clash Grotesk", "Inter", sans-serif;
      font-weight: 700;
      font-size: 14px;
      letter-spacing: -.01em;
    }

    @media (max-width: 900px) {
      .hero {
        grid-template-columns: 1fr;
        gap: 44px;
        padding: 70px 0 90px;
      }
      .copy { text-align: center; }
      .brand-pill, .button-shell { margin-left: auto; margin-right: auto; }
      h1, .lede { margin-left: auto; margin-right: auto; }
      .portrait-card { justify-self: center; }
    }

    @media (max-width: 520px) {
      .hero { width: min(100% - 30px, 1126px); padding-top: 42px; }
      .brand-pill { margin-bottom: 22px; }
      h1 { font-size: 39px; }
      .lede { margin-top: 18px; font-size: 15px; line-height: 1.65; }
      .button-shell { display: flex; width: 100%; }
      .cta { width: 100%; min-width: 0; }
      .portrait-card { padding: 13px; border-radius: 27px; }
      .portrait-card img { height: min(122vw, 480px); border-radius: 21px; }
      .caption { margin: 15px 2px 2px; font-size: 13px; }
    }
  </style>
</head>
<body>
  <main class="hero">
    <section class="copy" aria-labelledby="hero-title">
      <div class="brand-pill">
        <svg class="brand-mark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="m12 3-1.4 4.1a2 2 0 0 1-1.3 1.3L5 10l4.3 1.6a2 2 0 0 1 1.3 1.3L12 17l1.4-4.1a2 2 0 0 1 1.3-1.3L19 10l-4.3-1.6a2 2 0 0 1-1.3-1.3L12 3Z"/>
          <path d="M5 3v4M3 5h4M19 16v5M16.5 18.5h5"/>
        </svg>
        BTHEU
      </div>

      <h1 id="hero-title">How strong is<br>your voice?</h1>
      <p class="lede">Take a 5-minute Speaking Potential Snapshot and discover your current speaking, communication, and confidence level — plus exactly where to focus next.</p>

      <div class="button-shell">
        <a class="cta" href="form-survey.html">
          START MY ASSESSMENT
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M5 12h14M13 5l7 7-7 7"/>
          </svg>
        </a>
      </div>
    </section>

    <figure class="portrait-card">
      <img src="img/jishad.jpg" alt="Jishad Musthafa speaking with a microphone">
      <figcaption class="caption">Get ready to excel with Jishad Musthafa.</figcaption>
    </figure>
  </main>
</body>
</html>
